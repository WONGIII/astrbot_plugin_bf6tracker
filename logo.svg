<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <clipPath id="plate">
      <path d="M12 12 H214 L244 42 V244 H42 L12 214 Z"/>
    </clipPath>
  </defs>

  <!-- 底板：对角切角方块 -->
  <path d="M12 12 H214 L244 42 V244 H42 L12 214 Z" fill="#0d1116"/>
  <g clip-path="url(#plate)">
    <rect x="12" y="12" width="232" height="232" fill="url(#grid)"/>
    <rect x="12" y="12" width="232" height="70" fill="url(#acc2)" opacity="0.08"/>
  </g>
  <path d="M12 12 H214 L244 42 V244 H42 L12 214 Z" fill="none" stroke="#333d47" stroke-width="3"/>
  <path d="M214 12 L244 42" stroke="url(#acc)" stroke-width="5" stroke-linecap="square"/>
  <path d="M42 244 L12 214" stroke="url(#acc)" stroke-width="5" stroke-linecap="square"/>

  <!-- 左上角标识块 -->
  <rect x="28" y="28" width="14" height="14" fill="url(#acc)"/>
  <rect x="46" y="28" width="6" height="14" fill="#3a4450"/>
  <rect x="28" y="46" width="6" height="14" fill="#3a4450"/>

  <!-- 准星：环心 (128,122)，与锁定框/BF6 同一几何中心 -->
  <g stroke="url(#acc)" stroke-width="7" fill="none">
    <path d="M128 48 A74 74 0 0 1 194.4 86"/>
    <path d="M202 122 A74 74 0 0 1 164 188.4"/>
    <path d="M128 196 A74 74 0 0 1 61.6 158"/>
    <path d="M54 122 A74 74 0 0 1 92 55.6"/>
    <line x1="128" y1="28" x2="128" y2="46"/>
    <line x1="128" y1="198" x2="128" y2="216"/>
    <line x1="26" y1="122" x2="44" y2="122"/>
    <line x1="212" y1="122" x2="230" y2="122"/>
  </g>

  <!-- BF6：四角锁定框（box 76..180 x 101..143，中心 128,122） -->
  <g stroke="url(#acc)" stroke-width="6" fill="none" stroke-linecap="square">
    <path d="M76 115 V101 H90"/>
    <path d="M166 101 H180 V115"/>
    <path d="M180 129 V143 H166"/>
    <path d="M90 143 H76 V129"/>
  </g>
  <!-- 基线定位：Arial Black 帽高约0.72em，42px->30px，基线=122+15=137 -->
  <text x="128" y="137" text-anchor="middle"
        font-family="'Arial Black','Arial',sans-serif" font-weight="900"
        font-size="42" letter-spacing="1" fill="#e9edf1">BF6</text>

  <!-- TRACKER：x 右移 3.5 补偿末字符 letter-spacing -->
  <text x="131.5" y="233" text-anchor="middle"
        font-family="'Arial',sans-serif" font-weight="bold"
        font-size="15" letter-spacing="7" fill="url(#acc2)">TRACKER</text>
</svg>
